version: "3.8"

services:
  forex-bot:
    build: .
    container_name: forex-signal-bot
    restart: always
    env_file:
      - .env
    volumes:
      - ./logs:/app/logs
      - ./forex_bot.log:/app/forex_bot.log
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('https://api.telegram.org')"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
